# Render Blueprint: one free web service that serves the API, Socket.io and the built React app.
# Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: nightwire
    runtime: node
    plan: free
    region: frankfurt # closest Render region to the Atlas cluster (AWS eu-north-1)
    buildCommand: npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      # Random 256-bit secret generated by Render on first deploy
      - key: JWT_SECRET
        generateValue: true
      - key: EMAIL_FROM_NAME
        value: NightWire
      # Values below are entered in the Render dashboard (sync: false = never stored in git)
      - key: MONGO_URI
        sync: false
      - key: CLIENT_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: ARCJET_KEY
        sync: false
